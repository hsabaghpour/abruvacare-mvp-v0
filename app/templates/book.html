{% extends "base.html" %}

{% block title %}Book Appointment - AbruvaCare{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Request an appointment at {{ centre.name }}</h2>
    <p class="form-description">{{ centre.address }}, {{ centre.city }}</p>
    
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="/book" class="form">
        <input type="hidden" name="centre_id" value="{{ centre_id }}">
        <input type="hidden" name="location_input" value="{{ location_input }}">
        <input type="hidden" name="service_type" value="{{ service_type }}">
        
        <div class="form-group">
            <label for="patient_name">Your Name *</label>
            <input 
                type="text" 
                id="patient_name" 
                name="patient_name" 
                required
                value="{{ patient_name or '' }}"
            >
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                required
                value="{{ email or '' }}"
            >
        </div>
        
        <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input 
                type="tel" 
                id="phone" 
                name="phone"
                value="{{ phone or '' }}"
            >
        </div>
        
        <div class="form-group">
            <label for="preferred_contact_method">Preferred Contact Method</label>
            <select id="preferred_contact_method" name="preferred_contact_method">
                <option value="">-- No preference --</option>
                <option value="email">Email</option>
                <option value="phone">Phone</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="preferred_time_window">Preferred Time Window (optional)</label>
            <input 
                type="text" 
                id="preferred_time_window" 
                name="preferred_time_window"
                placeholder="e.g., weekday evenings, mornings only"
                value="{{ preferred_time_window or '' }}"
            >
        </div>
        
        <div class="form-group">
            <label for="notes">Additional Notes (optional)</label>
            <textarea 
                id="notes" 
                name="notes" 
                rows="4"
                placeholder="Any additional information about your appointment request"
            >{{ notes or '' }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Request</button>
            <a href="/centres?location_input={{ location_input }}&service_type={{ service_type }}" class="btn btn-secondary">Back to Centres</a>
        </div>
    </form>
</div>
{% endblock %}
