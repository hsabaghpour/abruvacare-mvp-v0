<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AbruvaCare{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="global-header">
      <nav class="navbar">
        <div class="nav-container">
          <div class="nav-brand">
            <a href="/patients" class="brand-link">
              <img
                src="/static/abruva-logo.png"
                alt="AbruvaCare"
                class="brand-logo-home"
              />
            </a>
          </div>
          <button
            class="mobile-menu-toggle"
            aria-label="Toggle menu"
            onclick="toggleMobileMenu()"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="nav-links" id="navLinks">
            <a
              href="/patients"
              class="nav-link {% if request.url.path == '/' or request.url.path.startswith('/patients') %}active{% endif %}"
              >For Patients</a
            >
            <a
              href="#"
              class="nav-link {% if request.url.path == '/providers' %}active{% endif %}"
              >For Healthcare Providers</a
            >
            <a
              href="/about"
              class="nav-link {% if request.url.path == '/about' %}active{% endif %}"
              >About Us</a
            >
            <a
              href="/support"
              class="nav-link {% if request.url.path == '/support' %}active{% endif %}"
              >Support</a
            >
          </div>
        </div>
      </nav>
      <div class="canada-banner">
        <img
          src="/static/canada-flag.png"
          alt="Canada Flag"
          class="flag-icon"
          onerror="this.style.display='none'"
        />
        <span class="canada-text">Proudly Canadian</span>
      </div>
    </header>

    <main class="main-content">{% block content %}{% endblock %}</main>

    <footer class="footer">
      <p>&copy; 2025 AbruvaCare. All rights reserved.</p>
    </footer>

    <script>
      function toggleMobileMenu() {
        const navLinks = document.getElementById("navLinks");
        navLinks.classList.toggle("mobile-open");
      }
    </script>
  </body>
</html>
